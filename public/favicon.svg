<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal Shield Base -->
  <polygon points="32,3 58,16 58,46 32,59 6,46 6,16" fill="url(#shieldGrad)" stroke="#38BDF8" stroke-width="2.5" />

  <!-- Dynamic Cold Speed Trail / Chill Lines -->
  <path d="M12 24 L22 24" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
  <path d="M9 30 L19 30" stroke="#00F0FF" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
  <path d="M14 36 L24 36" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>

  <!-- Transport Truck Silhouette (Right Facing, Modern Aerodynamic Reefer) -->
  <g transform="translate(18, 20)">
    <!-- Trailer (Reefer Body) -->
    <rect x="2" y="2" width="16" height="15" rx="1.5" fill="#0F172A" stroke="#38BDF8" stroke-width="1.8"/>
    
    <!-- Snowflake inside Reefer Container -->
    <g transform="translate(10, 9.5) scale(0.48)" stroke="#00F0FF" stroke-width="2.2" stroke-linecap="round">
      <line x1="0" y1="-8" x2="0" y2="8"/>
      <line x1="-7" y1="-4" x2="7" y2="4"/>
      <line x1="-7" y1="4" x2="7" y2="-4"/>
      <!-- Snowflake branch chevrons -->
      <path d="M -3 -6 L 0 -8 L 3 -6"/>
      <path d="M -3 6 L 0 8 L 3 6"/>
      <circle cx="0" cy="0" r="1.8" fill="#38BDF8"/>
    </g>

    <!-- Cab Front (Aerodynamic truck cabin) -->
    <path d="M18 7 L24 10 L27 12 L27 17 L18 17 Z" fill="#0284C7" stroke="#38BDF8" stroke-width="1.5"/>
    <!-- Windshield -->
    <polygon points="19,8.5 23,10.5 23,13 19,13" fill="#E0F2FE" opacity="0.9"/>

    <!-- Wheels with Cold Hubs -->
    <circle cx="6" cy="18" r="2.8" fill="#1E293B" stroke="#00F0FF" stroke-width="1.2"/>
    <circle cx="6" cy="18" r="1" fill="#38BDF8"/>
    <circle cx="23" cy="18" r="2.8" fill="#1E293B" stroke="#00F0FF" stroke-width="1.2"/>
    <circle cx="23" cy="18" r="1" fill="#38BDF8"/>
  </g>
</svg>